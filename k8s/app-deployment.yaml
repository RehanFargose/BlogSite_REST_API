apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogsite-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blogsite-app
  template:
    metadata:
      labels:
        app: blogsite-app
    spec:
      containers:
        - name: app
          image: rehanfargose/bookapidbproject-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              value: http://blogsite-api:4000
---
apiVersion: v1
kind: Service
metadata:
  name: blogsite-app
spec:
  selector:
    app: blogsite-app
  ports:
    - port: 3000
      targetPort: 3000
  type: LoadBalancer
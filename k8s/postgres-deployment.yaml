apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogsite-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blogsite-db
  template:
    metadata:
      labels:
        app: blogsite-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "blogdb"
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pgdata
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: blogsite-db
spec:
  selector:
    app: blogsite-db
  ports:
    - port: 5432
      targetPort: 5432